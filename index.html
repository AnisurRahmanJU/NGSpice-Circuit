<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGSpice Circuit Studio — schematic ⇄ NGspice simulator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0f2740"/><path d="M4 16h5l2-6 4 12 3-9 2 3h8" fill="none" stroke="#4cc3ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><b>NGSpice Circuit</b><span>Studio</span></div></div>
  <div class="ex"><label for="topic">Topic</label><select id="topic"></select><label for="exsel">Example</label><select id="exsel"></select></div>
  <span class="sp"></span>
  <div class="grp"><button id="bNew" title="New schematic">New</button><button id="bOpen" title="Open a .cir netlist">Open</button><button id="bCir" title="Save netlist (.cir)">Save .cir</button><button id="bSvg" title="Export schematic as SVG">SVG</button><button id="bPng" title="Export schematic as PNG">PNG</button></div>
  <div class="grp"><button id="bUndo" title="Undo (Ctrl+Z)">↶</button><button id="bRedo" title="Redo (Ctrl+Y)">↷</button></div>
  <label class="auto"><input type="checkbox" id="auto" checked> Auto-run</label>
  <button id="bRun" class="run">▶ Run simulation</button>
  <button id="bTheme" title="Toggle light/dark">◐</button>
  <input type="file" id="fileIn" accept=".cir,.net,.sp,.txt,.spice" hidden>
</header>
<div class="work">
  <aside class="palette">
    <input id="psearch" type="search" placeholder="Search components…" aria-label="Search components">
    <div id="plist"></div>
    <p class="tip"><b>Tips</b><br>Click a part, then click the canvas. <kbd>R</kbd> rotate · <kbd>M</kbd> mirror · <kbd>W</kbd> wire · <kbd>Del</kbd> delete · <kbd>Esc</kbd> cancel. Click a pin to start a wire.</p>
  </aside>
  <section class="center">
    <div class="canvas-wrap" id="cv">
      <div class="tools">
        <button data-tool="select" class="on" title="Select / move (Esc)">⬉</button><button data-tool="wire" title="Draw wire (W)">╱</button><i></i>
        <button id="tRot" title="Rotate (R)">⟳</button><button id="tMir" title="Mirror (M)">⇋</button><button id="tDel" title="Delete (Del)">🗑</button><i></i>
        <button id="tFit" title="Fit to view (F)">⤢</button><button id="tZi" title="Zoom in">＋</button><button id="tZo" title="Zoom out">－</button>
      </div>
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" tabindex="0">
        <defs><pattern id="gp" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r=".9" fill="var(--grid)"/></pattern><pattern id="gp2" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="var(--grid2)"/></pattern></defs>
        <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#gp)"/><rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#gp2)"/>
        <g id="scene"></g><g id="over"></g>
      </svg>
      <div class="status"><span id="sCoord">x 0 · y 0</span><span id="sHint">Select tool</span><span class="sp"></span><span id="sCount"></span></div>
    </div>
    <div class="vsplit" id="split" title="Drag to resize · double-click to minimize"></div>
    <div class="dock">
      <div class="dockbar"><button id="dockT" title="Minimize / restore simulation window">▾</button><button id="dockB" title="Enlarge / shrink simulation window">⤢</button><b>Simulation</b><div id="tabs"><button data-t="op">Operating point</button><button data-t="dc">DC sweep</button><button data-t="ac">AC</button><button data-t="tran">Transient</button></div><span class="sp"></span><span id="simst"></span></div>
      <div id="out"></div>
    </div>
  </section>
  <aside class="side">
    <div class="stabs"><button data-p="prop" class="on">Properties</button><button data-p="net">NGspice netlist</button></div>
    <div id="pProp" class="spanel"></div>
    <div id="pNet" class="spanel" hidden>
      <div class="nbar"><select id="addan" aria-label="Add analysis"><option value="">＋ Analysis</option><option value="op">.op</option><option value="dc">.dc sweep</option><option value="ac">.ac sweep</option><option value="tran">.tran</option></select><button id="bCopy">Copy</button><span class="hint">edits redraw the circuit</span></div>
      <div class="editor"><pre id="gut" aria-hidden="true"></pre><div class="cwrap"><pre id="hl" aria-hidden="true"></pre><textarea id="src" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="NGspice netlist"></textarea></div></div>
      <div id="nerr"></div>
    </div>
  </aside>
</div>
<script src="ngspice.js"></script>
</body>
</html>
